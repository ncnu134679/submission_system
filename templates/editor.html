
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯投稿管理</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #F4F6F7;
            color: #293B46;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 35px;
            background-color: white;
            border: 1px solid #E1E6E9;
            border-radius: 8px;
        }

        /* 返回首頁 */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #405D68;
            text-decoration: none;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #EDF1F3;
            color: #354B56;
            font-weight: bold;
        }

        th, td {
            border-bottom: 1px solid #E1E6E9;
            padding: 15px;
            text-align: left;
        }

        td {
            color: #4F5F67;
        }

        tbody tr:hover {
            background-color: #F8FAFB;
        }

        /* 查看內容按鈕 */
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: #405D68;
            color: white;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #304A54;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 返回首頁 -->
        <a href="/" class="back-link">← 返回首頁</a>

        <h1>待審查投稿清單</h1>

        <table>
            <thead>
                <tr>
                    <th>作者</th>
                    <th>投稿類別</th>
                    <th>文章標題</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody id="manuscript-list">
                <tr>
                    <td colspan="4">資料載入中...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script>

        // 取得待審查稿件
        function loadManuscripts() {

            fetch("/editor/manuscripts")
                .then(response => {

                    if (!response.ok) {
                        throw new Error("取得稿件失敗");
                    }

                    return response.json();

                })
                .then(data => {

                    const list = document.getElementById("manuscript-list");

                    list.innerHTML = "";

                    if (data.length === 0) {

                        list.innerHTML = `
                            <tr>
                                <td colspan="4">目前沒有待審查稿件</td>
                            </tr>
                        `;

                        return;
                    }

                    data.forEach(manuscript => {

                        const row = document.createElement("tr");

                        const authorCell = document.createElement("td");
                        authorCell.textContent = manuscript.author;

                        const categoryCell = document.createElement("td");
                        categoryCell.textContent = manuscript.category;

                        const titleCell = document.createElement("td");
                        titleCell.textContent = manuscript.title;

                        const actionCell = document.createElement("td");

                        const button = document.createElement("button");
                        button.textContent = "查看內容";
                        button.addEventListener("click", function() {
                            viewManuscript(manuscript.id);
                        });

                        actionCell.appendChild(button);

                        row.appendChild(authorCell);
                        row.appendChild(categoryCell);
                        row.appendChild(titleCell);
                        row.appendChild(actionCell);

                        list.appendChild(row);

                    });

                })
                .catch(error => {

                    console.error("取得稿件失敗：", error);

                    document.getElementById("manuscript-list").innerHTML = `
                        <tr>
                            <td colspan="4">資料載入失敗，請稍後再試。</td>
                        </tr>
                    `;

                });

        }


        // 查看稿件內容
        function viewManuscript(id) {

            window.location.href = `/editor-manuscript-page?id=${id}`;

        }


        // 網頁載入時執行
        loadManuscripts();

    </script>

</body>
</html>
