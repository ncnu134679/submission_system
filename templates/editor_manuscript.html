
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>查看投稿內容</title>
</head>

<body>

<div class="container">

    <h1>投稿內容審查</h1>

    <p>作者：<span id="author"></span></p>

    <p>投稿類別：<span id="category"></span></p>

    <p>文章標題：<span id="title"></span></p>

    <h3>文章內容</h3>

    <div id="content"></div>

    <br>

    <button onclick="approveManuscript()">通過</button>

    <button onclick="returnManuscript()">退回</button>

    <button onclick="goBack()">返回清單</button>

</div>

<script>

    // 取得網址中的稿件 ID
    const params = new URLSearchParams(window.location.search);

    const manuscriptId = params.get("id");


    // 載入稿件內容
    function loadManuscript() {

        if (!manuscriptId) {
            alert("沒有指定稿件 ID");
            window.location.href = "/editor-page";
            return;
        }

        fetch(`/editor/manuscripts/${manuscriptId}`)
            .then(response => response.json())
            .then(data => {

                if (!data.id) {
                    alert(data.message);
                    window.location.href = "/editor-page";
                    return;
                }

                document.getElementById("author").textContent = data.author;

                document.getElementById("category").textContent = data.category;

                document.getElementById("title").textContent = data.title;

                document.getElementById("content").textContent = data.content;

            })
            .catch(error => {
                alert("取得稿件內容失敗");
                console.error(error);
            });

    }


    // 通過投稿
    function approveManuscript() {

        if (!confirm("確定通過這篇投稿嗎？")) {
            return;
        }

        fetch(`/editor/manuscripts/${manuscriptId}/approve`, {
            method: "PUT"
        })
        .then(response => response.json())
        .then(data => {

            alert(data.message);

            if (data.status === "已通過") {
                window.location.href = "/editor-page";
            }

        })
        .catch(error => {
            alert("審查失敗");
            console.error(error);
        });

    }


    // 退回投稿
    function returnManuscript() {

        if (!confirm("確定退回這篇投稿嗎？")) {
            return;
        }

        fetch(`/editor/manuscripts/${manuscriptId}/return`, {
            method: "PUT"
        })
        .then(response => response.json())
        .then(data => {

            alert(data.message);

            if (data.status === "編輯中") {
                window.location.href = "/editor-page";
            }

        })
        .catch(error => {
            alert("退回失敗");
            console.error(error);
        });

    }


    // 返回清單
    function goBack() {

        window.location.href = "/editor-page";

    }


    // 網頁載入時執行
    loadManuscript();

</script>

</body>
</html>
