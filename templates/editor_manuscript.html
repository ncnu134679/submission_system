
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>投稿內容審查</title>

    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #F4F6F7;
            color: #293B46;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 35px;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #405D68;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .info {
            background-color: #F4F6F7;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        .info p {
            margin: 10px 0;
        }

        .info strong {
            display: inline-block;
            width: 90px;
        }

        .content-section h2,
        .feedback-section h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        #content {
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #E1E6E9;
            margin: 30px 0;
        }

        .feedback-section textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 15px;
            font-family: "Microsoft JhengHei", sans-serif;
            border: 1px solid #D5DDE1;
            border-radius: 5px;
            resize: vertical;
        }

        .feedback-section textarea:focus {
            outline: none;
            border-color: #405D68;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            padding: 10px 22px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        .return-button {
            background-color: white;
            color: #405D68;
            border: 1px solid #405D68;
        }

        .return-button:hover {
            background-color: #F4F6F7;
        }

        .approve-button {
            background-color: #405D68;
            color: white;
        }

        .approve-button:hover {
            background-color: #293B46;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/editor-page" class="back-link">← 返回投稿清單</a>

    <h1>投稿內容審查</h1>

    <div class="info">
        <p>
            <strong>作者：</strong>
            <span id="author"></span>
        </p>

        <p>
            <strong>投稿類別：</strong>
            <span id="category"></span>
        </p>

        <p>
            <strong>文章標題：</strong>
            <span id="title"></span>
        </p>
    </div>

    <div class="content-section">
        <h2>文章內容</h2>
        <p id="content"></p>
    </div>

    <hr class="section-divider">

    <div class="feedback-section">
        <h2>編輯建議</h2>
        <textarea
            id="editor_feedback"
            placeholder="請填寫不通過原因或建議作者修改的內容..."
            rows="5"
        ></textarea>
    </div>

    <div class="button-group">

        <button
            class="return-button"
            onclick="returnManuscript()">
            不通過
        </button>

        <button
            class="approve-button"
            onclick="approveManuscript()">
            通過
        </button>

    </div>

</div>

<script>
    const manuscriptId =
        new URLSearchParams(window.location.search).get("id");


    // 載入投稿內容
    function loadManuscript() {

        if (!manuscriptId) {
            alert("沒有指定稿件 ID");
            window.location.href = "/editor-page";
            return;
        }

        fetch(`/editor/manuscripts/${manuscriptId}`)
        .then(response => response.json())
        .then(data => {

            if (!data.id) {
                alert(data.message || "找不到稿件");
                window.location.href = "/editor-page";
                return;
            }

            document.getElementById("author").textContent =
                data.author;

            document.getElementById("category").textContent =
                data.category;

            document.getElementById("title").textContent =
                data.title;

            document.getElementById("content").textContent =
                data.content;

        })
        .catch(error => {
            console.error("載入投稿失敗：", error);
            alert("載入投稿內容時發生錯誤");
        });
    }


    // 通過投稿
    function approveManuscript() {

        if (!confirm("確定要通過這篇投稿嗎？")) {
            return;
        }

        fetch(`/editor/manuscripts/${manuscriptId}/approve`, {
            method: "PUT"
        })
        .then(response => response.json())
        .then(data => {

            if (data.status === "已通過") {
                alert("稿件已通過！");
                window.location.href = "/editor-page";
            } else {
                alert(data.message || "操作失敗");
            }

        })
        .catch(error => {
            console.error("通過投稿失敗：", error);
            alert("審查時發生錯誤");
        });
    }


    // 不通過投稿
    function returnManuscript() {

        const feedback = document
            .getElementById("editor_feedback")
            .value.trim();

        if (feedback === "") {
            alert("請填寫編輯建議，再執行不通過。");
            return;
        }

        if (!confirm("確定要將這篇投稿設為不通過嗎？")) {
            return;
        }

        const formData = new FormData();

        formData.append("editor_feedback", feedback);

        fetch(`/editor/manuscripts/${manuscriptId}/return`, {
            method: "PUT",
            body: formData
        })
        .then(response => response.json())
        .then(data => {

            if (data.status === "編輯中") {
                alert("稿件已設為不通過，並退回作者修改！");
                window.location.href = "/editor-page";
            } else {
                alert(data.message || "操作失敗");
            }

        })
        .catch(error => {
            console.error("不通過投稿失敗：", error);
            alert("審查時發生錯誤");
        });
    }


    // 頁面載入時執行
    loadManuscript();

</script>

</body>
</html>
