
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>新增投稿</title>

    <style>
        body {
            margin: 30px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 500px;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 200px;
        }

        button {
            display: block;
            margin-top: 20px;
            padding: 6px 15px;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <a class="back-link" href="/author-page">← 返回投稿清單</a>

        <h1>新增投稿</h1>

        <form id="manuscript-form">

            <label>投稿類別</label>
            <input type="text" id="category" required>

            <label>文章標題</label>
            <input type="text" id="title" required>

            <label>文章內容</label>
            <textarea id="content" required></textarea>

            <button type="submit">送出新增</button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        const authorId = 1;

        document.getElementById("manuscript-form")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            const formData = new FormData();

            formData.append("category",
                document.getElementById("category").value);

            formData.append("title",
                document.getElementById("title").value);

            formData.append("content",
                document.getElementById("content").value);

            fetch(`/author/${authorId}/manuscripts`, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {

                console.log("新增回傳資料：", data);

                if (data.id) {
                    alert("投稿新增成功！");
                    window.location.assign("/author-page");
                } else {
                    alert("新增失敗：" + data.message);
                }

            })
            .catch(error => {
                alert("發生錯誤，請檢查 FastAPI");
                console.error(error);
            });

        });
    </script>

</body>
</html>
